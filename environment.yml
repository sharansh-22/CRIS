name: CRIS
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas
  - numpy
  - matplotlib
  - scipy
  - wandb
  - psutil
  - pyyaml
  - scikit-learn
  - xgboost
  - lightgbm
  - shap
  - pyarrow
  - joblib
  - tabulate
  - seaborn
  - pip
  - pip:
    - yfinance
    - antropy
    - pydantic>=2.0
    - torch --index-url https://download.pytorch.org/whl/cu124
